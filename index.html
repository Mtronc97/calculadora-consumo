<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Pulse - Calculadora Futurista</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050509',
                        electricBlue: '#00f2fe',
                        neonPurple: '#4facfe',
                    },
                    boxShadow: {
                        'neon-blue': '0 0 15px rgba(0, 242, 254, 0.5)',
                        'neon-card': '0 0 25px rgba(79, 172, 254, 0.2)',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-darkBg text-gray-200 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

    <div class="w-full max-w-md bg-white/5 backdrop-blur-xl p-8 rounded-2xl border border-white/10 shadow-neon-card">
        
        <h1 class="text-3xl font-extrabold text-center mb-8 tracking-widest uppercase">
            <span class="bg-clip-text text-transparent bg-gradient-to-r from-neonPurple to-electricBlue">
                Fuel Pulse
            </span>
        </h1>
        
        <p class="text-center text-gray-400 mb-8 text-sm">Cálculo de Consumo Inteligente</p>

        <form id="calc-form" class="flex flex-col gap-6">
            
            <div class="relative">
                <label class="text-xs text-electricBlue uppercase tracking-wider pl-1 mb-1 block">Kilómetros Iniciales</label>
                <input type="number" id="km-inicio" placeholder="0.0" required
                    class="w-full bg-black/30 border border-gray-700 text-white rounded-lg px-4 py-3 text-lg placeholder:text-gray-600 focus:outline-none focus:border-electricBlue focus:ring-1 focus:ring-electricBlue focus:shadow-neon-blue transition duration-300">
            </div>

            <div class="relative">
                <label class="text-xs text-electricBlue uppercase tracking-wider pl-1 mb-1 block">Kilómetros Finales</label>
                <input type="number" id="km-fin" placeholder="0.0" required
                    class="w-full bg-black/30 border border-gray-700 text-white rounded-lg px-4 py-3 text-lg placeholder:text-gray-600 focus:outline-none focus:border-electricBlue focus:ring-1 focus:ring-electricBlue focus:shadow-neon-blue transition duration-300">
            </div>

            <div class="relative">
                <label class="text-xs text-electricBlue uppercase tracking-wider pl-1 mb-1 block">Litros Cargados</label>
                <input type="number" id="litros" placeholder="0.0" step="0.01" required
                    class="w-full bg-black/30 border border-gray-700 text-white rounded-lg px-4 py-3 text-lg placeholder:text-gray-600 focus:outline-none focus:border-electricBlue focus:ring-1 focus:ring-electricBlue focus:shadow-neon-blue transition duration-300">
            </div>

            <button type="submit" 
                class="w-full mt-4 bg-gradient-to-r from-neonPurple to-electricBlue text-darkBg font-bold uppercase tracking-widest py-4 rounded-lg hover:from-electricBlue hover:to-neonPurple transform hover:scale-[1.02] transition duration-300 shadow-neon-blue active:scale-[0.98]">
                Analizar Consumo
            </button>

            <button type="button" id="agregar-carga"
                class="w-full mt-3 bg-gradient-to-r from-emerald-600 to-teal-500 text-white font-bold uppercase tracking-widest py-4 rounded-lg hover:from-emerald-500 hover:to-teal-400 transform hover:scale-[1.02] transition duration-300 shadow-neon-blue active:scale-[0.98]">
                Agregar Carga
            </button>
        </form>

        <div id="resultado" class="mt-8 text-center min-h-[50px] transition-all duration-500">
            </div>

        <!-- Tabla de Registros -->
        <div id="tabla-container" class="mt-8 hidden">
            <h2 class="text-xl font-bold text-center mb-4 text-electricBlue uppercase">Historial de Cargas</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm border-collapse">
                    <thead>
                        <tr class="border-b border-electricBlue">
                            <th class="text-left py-2 px-2 text-electricBlue">Km Inicio</th>
                            <th class="text-left py-2 px-2 text-electricBlue">Km Fin</th>
                            <th class="text-left py-2 px-2 text-electricBlue">Litros</th>
                            <th class="text-left py-2 px-2 text-electricBlue">Distancia</th>
                            <th class="text-left py-2 px-2 text-electricBlue">Consumo L/100km</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-registros">
                    </tbody>
                </table>
            </div>
            <div class="mt-4 flex justify-center">
                <button type="button" id="finalizar-viaje" class="w-full max-w-sm bg-gradient-to-r from-violet-700 to-fuchsia-500 text-white font-bold uppercase tracking-widest py-3 rounded-lg hover:from-fuchsia-500 hover:to-violet-600 transform hover:scale-[1.02] transition duration-300 shadow-neon-blue active:scale-[0.98]">
                    Finalizar Viaje y Calcular
                </button>
            </div>
            <div id="total-consumo" class="mt-3 text-center text-lg font-bold text-electricBlue"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
